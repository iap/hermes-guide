[project]
name = "hermes-guide"
version = "0.9.8"
description = "Self-diagnosis and troubleshooting for Hermes Agent: read-only health checks and evidence-backed playbooks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[tool.mypy]
# Floor of the CI matrix (3.11 tracks upstream's .python-version): the static
# target must be the OLDEST supported version so 3.12-only constructs fail
# here instead of only in the 3.11 CI leg.
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
# The Hermes plugin API is loosely typed: `ctx` is passed in, and check
# envelopes are heterogeneous dicts. Requiring full annotations would add noise
# without value at this size; enable stricter flags later if desired.
disallow_untyped_defs = false
strict_equality = true

[tool.ruff]
target-version = "py311"
required-version = "0.16.4"
line-length = 100
extend-exclude = ["tools", "tests", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["F", "I", "UP", "SIM", "RUF", "DTZ", "ISC", "PLW", "N"]
ignore = ["N999", "E501", "PLW0603", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"checks.py" = ["N806", "RUF001", "RUF005", "SIM108", "UP015"]
