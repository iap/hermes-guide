# Qodo repository-specific review guidance for iap/hermes-guide.
#
# Scope: concrete, verifiable repository contracts and known false-positive traps.
# Keep it specific and short — Qodo expects clear, concise extra_instructions,
# not a handbook. AGENTS.md and CONTRIBUTING.md own the full rules; point to the
# relevant docs/agent/ section instead of restating them.
# The Qodo portal owns general review priorities, agent effort, and noise policy.

[pr_reviewer]
require_tests_review = true

[review_agent]
issues_user_guidelines = """This repo is hermes-guide: a READ-ONLY Hermes diagnostics plugin plus a separately installed skills tap, not Hermes core. Verify claims against current PR code and the relevant docs/agent/ section before alleging a violation.

Read-only: plugin sources must not write config/filesystem, auto-fix, or request unjustified capabilities (check_no_mutation.py is an AST guard, not a runtime proof). Default check_hooks_readonly() executes nothing; --deep may run `hermes hooks doctor` and execute approved hooks — keep the modes distinct.

Interfaces: checks.py `_CHECKS` labels must match guide scopes in tools/check_cli_surface.py `PLUGIN_COMMANDS`. FINDING_IDS is public API: add entries, never rename. Keep raw Hermes CLI output, plugin check envelopes, and harness `OK:`/`FAIL` text distinct; `hermes guide --json` is one stdout document with no update notice, `/hermes-doctor` stays text.

Upstream accuracy: drift-prone names belong in constants.py. For changed SKILL.md, verify commands, flags, YAML keys, paths, platform distinctions and fixes against a named Hermes revision or installed source. Never assume Claude Code/Cursor commands or plugin.json conventions; WSL is distinct from native Windows/Linux; a missing in-tree venv may be a valid PM-era install — inspect resolution code first.

Skills/provenance: enforce CONTRIBUTING.md rules, version bump, citations and dated provenance — a valid footer does not prove the body. check_skill_provenance.py, check_skill_version_bump.py and check_citation_integrity.py have distinct jobs; demand a fresh date only when facts were reverified.

Generated/releases: AGENTS.md and README.md inventory/scope blocks come from `python tools/render_docs.py --write` — never suggest hand-edits inside them. A version bump touches five sites: plugin.yaml, __init__.py, SECURITY.md policy sentence + supported table, pyproject.toml. CHANGELOG sections use the UTC day (HERMES_CHANGELOG_DATE override exists for tests).

Tests: changed tools/ behavior needs tools/test_*.py regression coverage wired into .github/workflows/reusable-ci.yml when required; skills/*/scripts/ need behavioral tests, not just text guards. Before claiming missing coverage, read the whole test module, fixtures, self-tests and CI wiring; name the exact untested behavior. Never suggest loosening validators or skipping tests.

Finding quality: for regex/parser/fallback/diagnostic findings cite current file:line, a reachable triggering input, expected vs actual, and the guard/test considered. Assess false acceptance and false rejection separately. If the path is outside the diff, call it cross-file; if evidence is thin, ask a verification question. Never import or execute untrusted plugin code for static checks.

Workflow: the release-blocking label is `P1`, not `priority:high` — verify labels exist before suggesting queries. For GitHub Actions inspect token permissions, fork PR trust, untrusted-code execution, job conditions and required status contexts.

Report only demonstrated, actionable violations of applicable contracts; do not duplicate findings for the same cause. Explain uncertainty when upstream or runtime evidence is unavailable."""
