name: upstream-drift-check

on:
  schedule:
    # Mondays 06:00 UTC (13:00 Asia/Jakarta)
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift-check
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check upstream schema drift
        run: python3 tools/check_upstream_drift.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: NousResearch/hermes-agent
          WATCH_FILES: hermes_cli/plugins.py tools/skills_tool.py agent/skill_utils.py agent/skill_bundles.py agent/skill_commands.py tools/skills_hub.py hermes_constants.py tools/memory_tool.py tools/memory_tool_store.py hermes_cli/config_defaults.py skills/autonomous-ai-agents/hermes-agent
