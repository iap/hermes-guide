name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Floor (3.11) tracks upstream's .python-version; ceiling (3.12) is
        # what this repo already ran. Upstream declares >=3.11,<3.14, so a
        # single pin in either direction just moves the drift.
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows runs the same steps except mypy, the plugin doctor, and the tap
    # smoke test, which stay Linux-gated (POSIX /tmp workaround and
    # Hermes-on-Windows CI unexplored upstream). Promoted to required after
    # the leg went green on first contact and every run since.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the version-bump guard can resolve the merge base
          # against origin/master (a depth-1 checkout makes it silently skip).
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hermes
        shell: bash
        run: |
          # pip/PyPI is no longer a supported Hermes distribution method
          # (PyPI is stale at 0.19.0). Install from the upstream git tag as an
          # editable install — wheel/sdist builds are blocked outside Nix, but
          # editable installs are the documented dev path. $RUNNER_TEMP keeps
          # the clone path valid on both Linux and Windows runners.
          git clone --depth 1 --branch v2026.9.11 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          pip install -e "$RUNNER_TEMP/hermes-agent"

      - name: Python syntax check
        run: python -m py_compile __init__.py checks.py constants.py

      - name: Type check
        # The /tmp package-copy workaround is POSIX-only; widen later if
        # Windows mypy coverage is wanted.
        if: runner.os == 'Linux'
        run: |
          pip install mypy types-PyYAML
          # mypy rejects the hyphenated `hermes-guide` dir as a package name;
          # typecheck the modules under a valid package name.
          mkdir -p /tmp/hermes_guide
          cp __init__.py checks.py constants.py /tmp/hermes_guide/
          mypy /tmp/hermes_guide

      - name: Plugin doctor
        # Hermes-on-Windows CI is unexplored upstream; the runtime tests below
        # already cover the plugin's own cross-platform paths.
        if: runner.os == 'Linux'
        run: hermes plugins doctor . --ci

      - name: Docs self-claim guard
        run: python tools/check_self_claim.py

      - name: No-mutation guard
        run: |
          python tools/check_no_mutation.py --selftest
          python tools/check_no_mutation.py

      - name: Read-only runtime smoke test
        run: python tools/test_readonly_runtime.py

      - name: MCP shape regression test
        run: python tools/test_mcp_shape.py

      - name: Memory hygiene regression test
        run: python tools/test_memory_hygiene.py
      - name: Exit contract (guide CLI)
        run: python tools/test_exit_contract.py

      - name: Skill version bump guard
        run: python tools/check_skill_version_bump.py

      - name: Version bump guard regression
        run: python tools/test_skill_version_bump.py

      - name: Skill-library behavioral test
        run: python tools/test_skill_checks.py

      - name: Hooks allowlist reachability regression
        run: python tools/test_reachable_allowlist_check.py

      - name: Plugin notes regression
        run: python tools/test_plugins_notes.py

      - name: Subcategory-dir constants regression
        run: python tools/test_plugin_skip_source.py

      - name: Upstream drift hygiene regression
        run: python tools/test_upstream_drift_hygiene.py

      - name: Scope validation regression
        run: python tools/test_scope_validation.py

      - name: Doc skill/check count consistency
        run: python tools/test_skill_counts.py

      - name: Tap discovery smoke test
        if: runner.os == 'Linux'
        timeout-minutes: 10
        # Installs run authenticated: on CI there is no $HERMES_HOME/.env and
        # no gh login, so get_secret() falls through to os.environ and
        # GitHubAuth picks this up (priority 1). Anonymous installs shared the
        # runner IP's 60 req/hr quota and died wholesale on #49 ("Could not
        # fetch ... rate limit exhausted"). Trade-off: the anonymous cold-user
        # path is no longer exercised here; scanner honesty is (no --force).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          hermes skills tap add iap/hermes-guide
          # Derive the list from the checkout, never hardcode it: a stale
          # hardcoded list is how the scanner verdicts on diagnosing-memory
          # and diagnosing-desktop shipped unnoticed (the step kept testing
          # nine skills while the repo had eleven).
          SKILLS=$(for d in skills/*/; do basename "$d"; done | sort | tr '\n' ' ')
          echo "skills under test: $SKILLS"
          pr_added=""
          failed=0
          for s in $SKILLS; do
            echo "::group::install $s"
            if ! out=$(hermes skills install --yes "iap/hermes-guide/skills/$s" 2>&1); then
              printf '%s\n' "$out"
              echo "::endgroup::"
              # No --force: every skill must pass the install scanner honestly.
              # The tap serves master, so on a PR ADDING a skill the fetch misses
              # until merge. Tolerate exactly that miss (the "Could not fetch"
              # signature) on pull_request events only; scanner verdicts, auth
              # failures, and every other failure still fail the step - on PRs
              # and on post-merge master pushes alike.
              if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] \
                 && printf '%s' "$out" | grep -q 'Could not fetch' \
                 && ! hermes skills list | grep -q "$s"; then
                echo "::warning::$s is added by this PR - not installable from the tap until merge"
                pr_added="$pr_added $s"
                continue
              fi
              echo "install failed: $s"
              failed=1
            else
              echo "::endgroup::"
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "OK: tap-install pass done; new-in-PR skills pending merge:${pr_added:- none}"

      - name: Security lint (bandit)
        run: |
          pip install bandit
          # Scan plugin runtime sources only (tools/ are CI utilities). B404/B603
          # are informational noise: this plugin legitimately calls the `hermes`
          # CLI via subprocess.run (list args, no shell=True).
          bandit __init__.py checks.py constants.py --skip B404,B603
