name: CI

# Thin caller. All CI logic lives in .github/workflows/reusable-ci.yml, which is
# also dispatchable by hand. Keeping the trigger surface separate from the test
# body means a future second caller (e.g. a merge_group queue leg) reuses the
# same body instead of copying 200 lines of `run:` steps.
on:
  push:
    branches: [master]
  # No base-branch filter on pull_request. `branches: [master]` silently skipped CI
  # for stacked PRs (one branch based on another), and a retarget to master fires
  # only `edited`, which is not a default trigger type -- so the workflow never ran.
  # A branch filter only ever *excluded* bases, so dropping it is purely additive.
  # `edited` is explicit: changing a PR's base emits `edited`, which is not a
  # default activity type, so a retarget after the parent merges would otherwise
  # run no checks against its new target. Title/body edits also emit `edited`,
  # which costs one CI run each.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A merge queue builds a temporary merge_group ref; without this trigger the
  # queued head would be merged with zero checks against the real merge result.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    # Called workflow, not `run:` steps. `uses` takes no `runs-on`/`steps` here.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      event-name: ${{ github.event_name }}
      # Built with the documented `cond && value || fallback` idiom, where BOTH
      # operands are strings, so `||` returns the fallback verbatim rather than a
      # boolean. On a pull_request the base is master unless the PR targets a
      # release branch; on push/merge_group there is no pull_request object, so
      # this must fall back to origin/master. A bare
      # `github.event.pull_request.base.ref` would interpolate to the empty
      # string on push and produce the invalid ref `origin/`, failing the
      # version-bump guard on every direct push to master.
      base-ref: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/master' }}
      # On a direct push to master the branch is already merged, so the tap can
      # only serve what is already on master: the PR-tolerance branch and the
      # network legs are not useful there. Every PR and every merge_group run
      # gets the full gate.
      run-full-gate: ${{ github.event_name != 'push' }}
      # A called workflow cannot escalate permissions beyond the caller's, so the
      # caller's `contents: read` is the ceiling. Nothing here needs more.
      #
      # `secrets: inherit` is deliberately NOT used. The called workflow reads no
      # secret: the tap step's `GH_TOKEN: ${{ github.token }}` is supplied by the
      # runner and is unaffected. Inheriting would hand every repository and
      # organization secret to a workflow whose source a same-repository PR can
      # change, so dropping the line costs nothing and removes that path.
