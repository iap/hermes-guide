name: "Skill drift (fact no longer matches Hermes)"
description: A claim in a skill or in checks.py/constants.py no longer matches the installed or upstream Hermes source.
labels: ["drift", "skills"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill or fact file
      options:
        - hermes-configuration-guide
        - installing-hermes
        - diagnosing-mcp
        - diagnosing-skills
        - diagnosing-commands
        - diagnosing-hooks
        - diagnosing-plugins
        - diagnosing-path
        - diagnosing-auth
        - diagnosing-memory
        - diagnosing-cli-tui
        - diagnosing-desktop
        - checks.py / constants.py
        - Other / multiple skills
    validations:
      required: true
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version / commit
      description: "`hermes --version`, or the git SHA you verified against"
      placeholder: "v2026.8.31"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence from source
      description: The upstream/installed source lines that contradict the guide (file + line numbers).
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested correction
