name: "Bug report"
description: Something in the plugin, checks, or docs is wrong or broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hermes version / commit
      placeholder: "v2026.9.24"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / environment
      description: Pick the platform you reproduced on.
      options:
        - macOS (Apple Silicon)
        - macOS Intel (legacy)
        - Linux
        - Windows native
        - WSL
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Command output or logs (redact tokens).
