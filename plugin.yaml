name: hermes-guide
version: 0.8.5
description: >-
  Self-diagnosis and troubleshooting for Hermes: deterministic health
  checks across `config`, `mcp`, `skills`, `commands`, `hooks`, `plugins`,
  `memories`, `sessions`, and `update`, plus the troubleshooting playbooks (a
  separate skills tap) for what the built-in doctor leaves out. Built for a
  session helping someone who does not read the source: each result gives a
  reason and, where the check has one, the path or output behind it, so the
  problem can be triaged before an upstream fix lands. Read-only: no config
  writes, no auto-fix. The hooks check runs `hermes hooks doctor`, which
  executes each approved hook once; proactive runs inspect hooks in-process and
  execute nothing.
manifest_version: 1
api_version: 1
license: MIT
# Loader-enforced version floor (hermes_cli/plugins_manifest.py::requires_hermes_error):
# unsatisfied Hermes builds record an error and skip the plugin before import.
requires_hermes: ">=0.21"
homepage: https://github.com/iap/hermes-guide
tags: [diagnostics, observability, troubleshooting]
python_dependencies:
  - PyYAML>=6.0,<7
# No `capabilities:` block = zero privileged capabilities. This plugin only
# reads config and inspects state, so the consent screen stays trivial.
config_schema:
  proactive:
    type: bool
    default: false
    description: "Fire drift checks on session start/end (opt-in)"
